x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HELM_POSTGRES_USER:-helm}
      POSTGRES_PASSWORD: ${HELM_POSTGRES_PASSWORD:-helm}
      POSTGRES_DB: ${HELM_POSTGRES_DB:-helm}
    volumes:
      - helm_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${HELM_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HELM_POSTGRES_USER:-helm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  web:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HELM_KEYWORD_EXPORT_DIR: /data/keyword-queues
    volumes:
      - helm_keyword_queues:/data/keyword-queues
    ports:
      - "127.0.0.1:${HELM_WEB_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  collector:
    build:
      context: ./backend
    command: ["uv", "run", "--no-dev", "python", "-m", "app.collector"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HELM_GOOGLE_CREDENTIALS_FILE: /run/secrets/google-sa.json
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # The directory, not the single file: Docker creates a *directory* at a missing single-file
      # bind-mount source, which would make the collector think a key exists. Never mount this into web.
      - ./secrets:/run/secrets:ro
    healthcheck:
      # The venv interpreter, not bare `python`: the dependencies (pydantic-settings, SQLAlchemy) live in /app/.venv.
      test: ["CMD", "/app/.venv/bin/python", "-m", "app.collector", "--healthcheck"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 10m
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging

  # Helm MCP server (streamable HTTP at /mcp). Same image as web, no Google credentials: it only reads and
  # writes Postgres through the service layer. Published to the internet only via the Cloudflare tunnel.
  mcp:
    build:
      context: ./backend
    command: ["uv", "run", "--no-dev", "python", "-m", "app.mcp_server"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HELM_KEYWORD_EXPORT_DIR: /data/keyword-queues
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - helm_keyword_queues:/data/keyword-queues
    ports:
      - "127.0.0.1:${HELM_MCP_PORT:-8020}:8020"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

volumes:
  helm_postgres_data:
  helm_keyword_queues:
