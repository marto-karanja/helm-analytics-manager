x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HELM_POSTGRES_USER:-helm}
      POSTGRES_PASSWORD: ${HELM_POSTGRES_PASSWORD:-helm}
      POSTGRES_DB: ${HELM_POSTGRES_DB:-helm}
    volumes:
      - helm_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${HELM_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HELM_POSTGRES_USER:-helm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  web:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HELM_WEB_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

volumes:
  helm_postgres_data:
